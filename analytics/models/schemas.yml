version: 2

models:
  - name: jobs_per_month
    description: "This model aggregates job postings by month and role."
    config:
      persist_docs:
        relation: true
        columns: true
    # Optional: Requires dbt-utils package to enforce composite grain
    # data_tests:
    #   - dbt_utils.unique_combination_of_columns:
    #       combination_of_columns:
    #         - month
    #         - role
    columns:
      - name: month
        description: "The month in which the job postings were made."
        data_tests:
          - not_null
      - name: role
        description: "The search term representing the job role."
        data_tests:
          - not_null
      - name: postings
        description: "The count of job postings for the given month and role."
        data_tests:
          - not_null

  - name: job_postings
    description: "This model contains the cleaned/staged job postings data."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: "Unique identifier for the job posting."
      - name: job_title
        description: "The title of the job posting."
        data_tests:
          - not_null
      - name: company_name
        description: "The name of the company offering the job."
        data_tests:
          - not_null
      - name: job_location
        description: "The location of the job posting."
      - name: job_via
        description: "The job board or source through which the posting was listed."
      - name: job_posted_at
        description: "The relative or parsed timestamp indicating when the job was posted."
      - name: job_salary
        description: "The salary or compensation range offered for the job posting."
      - name: job_schedule_type
        description: "The type of schedule for the job posting (e.g., full-time, part-time)."
      - name: job_work_from_home
        description: "Boolean flag indicating whether the job posting allows remote work."
      - name: job_extensions_raw
        description: "Raw list of additional job attributes (e.g., schedule, salary, benefits)."
      - name: job_detected_extensions_raw
        description: "Raw structured key-value metadata parsed from job extensions."
      - name: search_time
        description: "The exact timestamp when the search query was executed."
        data_tests:
          - not_null
      - name: search_date
        description: "The calendar date when the search query was executed."
        data_tests:
          - not_null
      - name: search_term
        description: "The search term used to find the job posting."
        data_tests:
          - not_null
      - name: search_location
        description: "The location parameter used in the search query."
      - name: error_message
        description: "Any error message encountered during ingestion or search for the posting."


  - name: top_locations
    description: "This model aggregates job postings by location and role."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: "The location of the job postings."
      - name: job_count
        description: "The count of job postings for the given location and role."



  - name: monthly_summary
    description: "Monthly summary of job postings; one row per month."
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: "The summary month (one row per month)."
        data_tests:
          - unique
          - not_null
      - name: total_postings
        description: "All postings that month (summed from jobs_per_month)."
        data_tests:
          - not_null
      - name: remote_jobs
        description: "Postings flagged as remote that month."
        data_tests:
          - not_null
      - name: remote_percentage
        description: "Share of the month's postings flagged as remote, expressed as a percentage."

